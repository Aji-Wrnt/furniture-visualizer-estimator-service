
services:
  # 1. DATABASE SERVICE: PostgreSQL 16
  postgres_db:
    image: postgres:16-alpine
    container_name: furniture_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-atmin200206}
      POSTGRES_DB: ${DB_NAME:-custom_furniture_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Data database tetap aman dan tidak hilang saat kontainer direstart
      - postgres_data:/var/lib/postgresql/data
      # Script DDL tabel & seed otomatis dijalankan saat DB pertama kali dibuat
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - furniture_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-custom_furniture_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # BACKEND API SERVICE: Node.js Express
  furniture_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: furniture_api_service
    restart: always
    ports:
      - "${PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      # Koneksi ke DB menggunakan nama service container di network internal ('postgres_db')
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-atmin200206}
      DB_NAME: ${DB_NAME:-custom_furniture_db}
    depends_on:
      postgres_db:
        condition: service_healthy # Tunggu sampai database siap
    networks:
      - furniture_network

# Penyimpanan data permanen di host
volumes:
  postgres_data:
    driver: local

# Jaringan internal antar-kontainer
networks:
  furniture_network:
    driver: bridge
